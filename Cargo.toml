[package]
name = "pgs3"
version = "0.1.0"
edition = "2021"
description = "S3 on Postgres."
license = "Apache-2.0"
publish = false

[[bin]]
name = "pgs3"
path = "src/main.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.2"
http = "1"
httpdate = "1"
md-5 = "0.10"
percent-encoding = "2"
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }

[dev-dependencies]
axum = "0.7"
futures-util = "0.3"
object_store = { version = "=0.12.5", default-features = false, features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
